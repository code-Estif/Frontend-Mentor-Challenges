<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Age calculator app</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <main class="container">
    <div class="card">
      <form class="form" id="ageForm">
        <div class="input-group">
          <div class="input-field">
            <label for="day" class="label">DAY</label>
            <input type="text" id="day" name="day" placeholder="DD" class="input" maxlength="2">
            <span class="error-message" id="dayError"></span>
          </div>
          
          <div class="input-field">
            <label for="month" class="label">MONTH</label>
            <input type="text" id="month" name="month" placeholder="MM" class="input" maxlength="2">
            <span class="error-message" id="monthError"></span>
          </div>
          
          <div class="input-field">
            <label for="year" class="label">YEAR</label>
            <input type="text" id="year" name="year" placeholder="YYYY" class="input" maxlength="4">
            <span class="error-message" id="yearError"></span>
          </div>
        </div>
        
        <div class="divider-container">
          <div class="divider"></div>
          <button type="submit" class="submit-button" id="submitBtn">
            <img src="./assets/images/icon-arrow.svg" alt="Calculate" class="arrow-icon">
          </button>
        </div>
      </form>
      
      <div class="result">
        <div class="result-item">
          <span class="result-number" id="years">--</span>
          <span class="result-label">years</span>
        </div>
        <div class="result-item">
          <span class="result-number" id="months">--</span>
          <span class="result-label">months</span>
        </div>
        <div class="result-item">
          <span class="result-number" id="days">--</span>
          <span class="result-label">days</span>
        </div>
      </div>
    </div>
  </main>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Esti</a>.
  </div>
  
  <script src="script.js"></script>
</body>
</html>
