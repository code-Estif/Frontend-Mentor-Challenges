<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Contact form</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="contact-heading">
      <h1 id="contact-heading">Contact Us</h1>
      <form id="contact-form" novalidate>
        <div class="row two">
          <div class="field" id="first-name-field">
            <label for="first-name">First Name <span class="required">*</span></label>
            <div class="control"><input id="first-name" name="firstName" type="text" autocomplete="given-name" required aria-describedby="first-name-hint"></div>
            <p class="hint" id="first-name-hint" role="alert" aria-live="polite"></p>
          </div>
          <div class="field" id="last-name-field">
            <label for="last-name">Last Name <span class="required">*</span></label>
            <div class="control"><input id="last-name" name="lastName" type="text" autocomplete="family-name" required aria-describedby="last-name-hint"></div>
            <p class="hint" id="last-name-hint" role="alert" aria-live="polite"></p>
          </div>
        </div>

        <div class="field" id="email-field">
          <label for="email">Email Address <span class="required">*</span></label>
          <div class="control"><input id="email" name="email" type="email" inputmode="email" autocomplete="email" required aria-describedby="email-hint"></div>
          <p class="hint" id="email-hint" role="alert" aria-live="polite"></p>
        </div>

        <fieldset class="field" id="query-type-field">
          <legend><span style="font-weight:700;">Query Type</span> <span class="required">*</span></legend>
          <div class="options" role="radiogroup" aria-describedby="query-type-hint">
            <label class="option" for="general-enquiry">
              <input type="radio" id="general-enquiry" name="queryType" value="General Enquiry" required>
              <span>General Enquiry</span>
            </label>
            <label class="option" for="support-request">
              <input type="radio" id="support-request" name="queryType" value="Support Request" required>
              <span>Support Request</span>
            </label>
          </div>
          <p class="hint" id="query-type-hint" role="alert" aria-live="polite"></p>
        </fieldset>

        <div class="field" id="message-field">
          <label for="message">Message <span class="required">*</span></label>
          <div class="control"><textarea id="message" name="message" required aria-describedby="message-hint"></textarea></div>
          <p class="hint" id="message-hint" role="alert" aria-live="polite"></p>
        </div>

        <div class="field" id="consent-field">
          <label class="checkbox" for="consent">
            <input type="checkbox" id="consent" name="consent" required>
            <span>I consent to being contacted by the team</span>
          </label>
          <p class="hint" id="consent-hint" role="alert" aria-live="polite"></p>
        </div>

        <div class="actions">
          <button type="submit">Submit</button>
        </div>
      </form>
      <div class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
        Coded by <a href="#">Estif</a>.
      </div>
    </section>
  </main>

  <div id="success-toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
    <img class="icon" src="./assets/images/icon-success-check.svg" alt="">
    <p class="title">Message Sent!</p>
    <p class="desc">Thanks for completing the form. We'll be in touch soon!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
