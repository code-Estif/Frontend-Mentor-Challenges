<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Social Links Profile</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <article class="profile-card">
      <header class="profile-header">
        <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall" class="profile-img">
        <h1 class="name">Jessica Randall</h1>
        <p class="location">London, United Kingdom</p>
      </header>
      
      <p class="bio">"Front-end developer and avid reader."</p>

      <nav class="social-links">
        <a href="https://github.com" class="social-link" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://frontendmentor.io" class="social-link" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>
        <a href="https://linkedin.com" class="social-link" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://twitter.com" class="social-link" target="_blank" rel="noopener noreferrer">Twitter</a>
        <a href="https://instagram.com" class="social-link" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>. 
    Coded by <a href="#">Estif</a>.
  </footer>
</body>
</html>
