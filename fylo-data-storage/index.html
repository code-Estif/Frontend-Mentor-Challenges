<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fylo Storage Component</title>
  <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <div class="left-card">
      <div class="logo">
        <img src="images/logo.svg" alt="">
               </div>
      <div class="icons">
        <div>
            <img src="images/icon-document.svg" alt="">
        </div>
        <div>
            <img src="images/icon-folder.svg" alt="">
        </div>
        <div>
            <img src="images/icon-upload.svg" alt="">
        </div>
      </div>
    </div>

    <div class="right-card">
      <div class="bubble">185 <span>GB LEFT</span></div>
      <div class="used">You've used <strong>815 GB</strong> of your storage</div>
      <div class="bar">
        <div class="progress"></div>
      </div>
      <div class="gb-values">
        <span>0 GB</span>
        <span>1000 GB</span>
      </div>
    </div>
  </div>
</body>
</html>
