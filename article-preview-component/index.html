<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Preview Component</title>
  <link href="https://fonts.googleapis.com/css?family=Manrope:500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <img class="card-img" src="images/drawers.jpg" alt="Drawers">
    <div class="card-content">
      <div class="card-title">
        Shift the overall look and feel by adding these wonderful touches to furniture in your home
      </div>
      <div class="card-desc">
        Ever been in a room and felt like something was missing? Perhaps it felt slightly bare and uninviting. I've got some simple tips to help you make any room feel complete.
      </div>
      <div class="card-footer">
        <div class="author">
          <img class="author-img" src="images/avatar-michelle.jpg" alt="Michelle Appleton">
          <div class="author-info">
            <span class="author-name">Michelle Appleton</span>
            <span class="author-date">28 Jun 2020</span>
          </div>
        </div>
        <div
              class="footer__share-popup"
              role="menu"
              aria-label="share options"
              aria-hidden="true"
            >
              <a href="#"
                ><img src="images/icon-facebook.svg" alt="Facebook"
              /></a>
              <a href="#"
                ><img src="images/icon-twitter.svg" alt="Twitter"
              /></a>
              <a href="#"
                ><img src="images/icon-pinterest.svg" alt="Pinterest"
              /></a>
            </div>
        <button class="share-btn" aria-label="Share">
          <svg viewBox="0 0 15 13"><path d="M15 6.5l-5.5-6v4c-6.5.5-7.5 5.5-7.5 8.5 2.5-3.5 7.5-4 7.5-4v4l5.5-6z"/></svg>
        </button>
        
      </div>
    </div>
  </div>
