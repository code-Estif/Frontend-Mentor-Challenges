<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Apparel Coming Soon Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-gradient-page">

  <main class="min-h-screen">
    <header class="pt-[32px] pl-[32px] pb-[32px] md:pt-[32px] md:pl-[80px] md:pb-[32px] lg:hidden">
      <img src="./images/logo.svg" alt="Base Apparel 로고" class="h-6 md:w-[100.78px] md:h-[19.94px]">
    </header>

    <figure class="lg:hidden full-bleed mb-16 md:mb-0">
      <picture>
        <img src="./images/hero-mobile.jpg" alt="Base Apparel 패션 모델"
          class="w-full h-64 object-cover md:h-auto md:max-h-[400px] md:object-cover">
      </picture>
    </figure>

    <div class="lg:grid lg:grid-cols-2 lg:gap-[220px] lg:min-h-screen">

      <section class="flex flex-col lg:order-1 desktop-bg-pattern">

        <header class="hidden lg:block lg:pt-[80px] lg:pl-[165px]">
          <img src="./images/logo.svg" alt="Base Apparel 로고" class="lg:w-[157.49px] lg:h-[31.5px]">
        </header>

        
        <div class="flex-grow flex items-center p-0 md:p-0 md:mt-16 lg:pl-[165px] lg:m-0 pb-0 md:pb-0 lg:pb-0">
          <div class="w-[311.5px] mx-auto max-w-[445px] md:w-[445px] lg:mx-0 lg:w-[445px] lg:h-[414px]">

         
            <section class="mb-8 text-center md:mb-8 md:text-center lg:text-left lg:mb-8">
              <h1
                class="text-[40px] text-center md:text-[64px] lg:text-[64px] uppercase tracking-[10px] md:tracking-[17.5px] lg:tracking-[17.5px] mb-4 md:mb-4 md:text-center lg:text-left">
               
                <span class="block font-light text-[#CE989B] mb-0 leading-[100%]">
                  We're
                </span>
                <span class="block font-semibold text-[#423A3A] leading-[1.1]">
                  Coming Soon
                </span>
              </h1>

              <p class="text-sm md:text-base text-[#CE989B] leading-7 md:leading-8">
                Hello fellow shoppers! We're currently building our new fashion store.
                Add your email below to stay up-to-date with announcements and our launch deals.
              </p>
            </section>

            <section class="mb-[92.06px] md:mb-[62.06px] lg:mb-0">
              <form class="relative" id="emailForm" novalidate>

                <input type="email" id="emailInput" name="email" placeholder="Email Address" class="w-full px-6 md:px-8 pr-24 md:pr-[116px] lg:pr-[116px]
                         h-[48px] md:h-[56px]
                         rounded-full border border-[#CE989B] bg-transparent
                         focus:outline-none focus:border-[#F96464] 
                         placeholder:text-[#CE989B] placeholder:opacity-50
                         text-base md:text-base" required aria-label="이메일 주소 입력" aria-invalid="false"
                  aria-required="true" autocomplete="email">
                <img src="./images/icon-error.svg" alt=""
                  class="absolute right-20 md:right-[108px] lg:right-[108px] top-1/2 -translate-y-1/2 hidden w-5 h-5 md:w-6 md:h-6"
                  id="errorIcon" aria-hidden="true">
                <button type="submit" class="absolute right-0 top-0 w-16 md:w-[100px] h-[48px] md:h-[56px]
                         bg-gradient-to-r from-[#F8BFBF] to-[#EE8B8B] 
                         rounded-full 
                         shadow-[4px_4px_15px_rgba(238,139,139,0.4)]
                         hover:shadow-[6px_6px_30px_rgba(238,139,139,0.6)] hover:from-[#F8AAAA] hover:to-[#EE7777]
                         transition-all duration-300
                         flex items-center justify-center
                         focus:outline-none focus:ring-2 focus:ring-[#F96464] focus:ring-offset-2"
                  aria-label="이메일 구독 신청">
                  <img src="./images/icon-arrow.svg" alt="" class="w-3 md:w-4" aria-hidden="true">
                </button>
              </form>

              <p class="text-[#F96464] text-xs md:text-sm mt-2 ml-6 md:ml-8 hidden" id="errorMessage" role="alert"
                aria-live="off">
                Please provide a valid email
              </p>
            </section>

          </div>
        </div>

      </section>

      <figure class="hidden lg:block lg:order-2">
        <picture>
          <img src="./images/hero-desktop.jpg" alt="Base Apparel 패션 모델" class="w-full h-screen object-cover">
        </picture>
      </figure>
    </div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
